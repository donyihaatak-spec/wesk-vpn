[package]
name = "vpn-configurator"
version = "0.1.0"
description = "Десктопный VPN/Proxy клиент (ключи vless/vmess как Happ + WireGuard)"
authors = ["neonclick"]
edition = "2021"
rust-version = "1.77"

# Библиотека нужна для мобильных таргетов Tauri и для модульного тестирования
# бизнес-логики (парсер конфигов, хранилище) без запуска GUI.
[lib]
name = "vpn_configurator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
percent-encoding = "2"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sysinfo = "0.33"

[features]
# Включается Tauri при production-сборке для удаления отладочных артефактов.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
strip = true
